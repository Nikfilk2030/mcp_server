name: Assignment checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assignment:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_ASSIGNMENT_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=test-results/assignment.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-results
          path: test-results/assignment.xml
