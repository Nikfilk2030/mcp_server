services:
  app:
    build: .
    environment:
      MCP_PUBLIC_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 192m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 96m
volumes:
  caddy_data:
  caddy_config:
